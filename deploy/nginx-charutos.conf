server {
    listen 80;
    server_name charutospremium.iterlabs.com.br;

    # Redireciona HTTP -> HTTPS (preenchido pelo certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name charutospremium.iterlabs.com.br;

    # Certificados SSL (gerados pelo certbot)
    ssl_certificate     /etc/letsencrypt/live/charutospremium.iterlabs.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/charutospremium.iterlabs.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend React (arquivos estáticos)
    root /opt/charutos-sistema/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend FastAPI
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Docs FastAPI (opcional)
    location /docs {
        proxy_pass http://127.0.0.1:3001/docs;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:3001/openapi.json;
    }

    client_max_body_size 10M;
}
